name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - run: npm run test:run

  publish:
    name: Publish to npm
    # Tags only: a manual run from a branch must never publish by accident.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Verify npm CLI supports trusted publishing
        run: |
          tested=11.5.1
          actual=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$tested" "$actual" | sort -V | head -n1)" != "$tested" ]; then
            echo "npm $actual is older than $tested; OIDC trusted publishing requires >= $tested" >&2
            exit 1
          fi

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify tag matches package.json version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      # Needed because prepack runs `tsc`, and typescript is a devDependency.
      - run: npm ci

      # Authentication comes from OIDC; the repository's trusted publisher
      # on npmjs.com must allow npm publish for this workflow filename.
      - run: npm publish

  release:
    name: GitHub release notes
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub release from merged PRs and commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
