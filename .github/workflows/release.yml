name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The callee requests the union of these; GitHub validates this before running,
# including for jobs that its `if` conditions skip.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: cusk-io/.github/.github/workflows/npm-publish.yml@v0.2.0
